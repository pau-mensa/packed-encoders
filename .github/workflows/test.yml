name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Torch 2.11 / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        profile: [base]
        include:
          - {python-version: "3.12", profile: qwen3_5}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      # Resolve the package and Torch together. This tests published requirements,
      # including the topk extra, without CUDA wheels or dependency bypasses.
      - name: Install dependencies
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          target="."
          if [[ "$PROFILE" != "base" ]]; then
            target=".[$PROFILE]"
          fi
          uv pip install --no-sources --torch-backend cpu -e "$target" pytest
          uv pip check
          python -c 'import torch; assert torch.version.cuda is None, torch.__version__; print(torch.__version__)'

      - name: Run tests
        run: pytest tests/

  lock:
    name: Installation lock and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv build --wheel
      # Wheels only: never invoke nvcc to check optional dependency resolution.
      - name: Resolve CUDA installation profiles
        run: |
          uv sync --locked --dry-run --no-dev --extra fa2 --extra qwen3_5
          uv sync --locked --dry-run --no-dev --extra fa2 --extra pylate
          uv sync --locked --dry-run --no-dev --extra fa4 --extra qwen3_5
